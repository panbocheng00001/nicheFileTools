name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep the whole run green-or-red quickly: no need to cancel a nearly-finished
# matrix leg just because another one started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Run converter / quota / security tests
        working-directory: desktop/src-tauri
        run: cargo test --lib

  frontend:
    name: Frontend typecheck, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck + production build
        working-directory: desktop
        run: npm run build

      - name: Unit tests
        working-directory: desktop
        run: npm test
