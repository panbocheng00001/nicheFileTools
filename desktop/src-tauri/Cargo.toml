[package]
name = "nichefiletools-desktop"
version = "0.1.0"
description = "nichefiletools desktop — free file format converter"
authors = ["nichefiletools"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nichefiletools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# converters
image = { version = "0.25", features = ["exr"] }   # PNG/EXR encoding (PVR/EXR -> PNG)
zip = "2"                     # OPF -> EPUB packaging
quick-xml = "0.36"            # OPF manifest parsing
flate2 = "1"                  # WAD (Quake) lump inflation
sha2 = "0.10"             # device hash
uuid = { version = "1", features = ["v4"] }   # persistent device id
ureq = { version = "2", features = ["json"] } # blocking HTTP for token/redeem
log = "0.4"

[features]
# default Tauri features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
